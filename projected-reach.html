<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projected Reach - UTAS Valorant Tournament 2024</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="the-event.html">The Event</a>
        <a href="projected-reach.html" class="active">Projected Reach</a>
        <a href="streaming-channels.html">Streaming Channels</a>
        <a href="impact.html">Impact</a>
        <a href="contact-us.html">Contact Us</a>
    </nav>

    <!-- Projected Reach Page -->
    <section class="slide active" data-slide="1">

        <!-- Static Background -->
        <div class="event-background"></div>

        <div class="hero">
            <div class="hero-background"></div>
            <div class="hero-overlay"></div>
            
            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="highlight">Projected Reach</span>
                </h1>
                
                <!-- Graph Card -->
                <div class="graph-card">
                    <div class="graph-header">
                        <h3>Reach Projection</h3>
                    </div>
                    
                    <div class="graph-container">
                        <div class="graph">
                            <!-- Y-axis labels -->
                            <div class="y-axis">
                                <div class="y-label">12K</div>
                                <div class="y-label">10K</div>
                                <div class="y-label">8K</div>
                                <div class="y-label">6K</div>
                                <div class="y-label">4K</div>
                                <div class="y-label">2K</div>
                                <div class="y-label">0</div>
                            </div>
                            
                            <!-- Graph bars -->
                            <div class="graph-bars">
                                <div class="bar-container">
                                    <div class="bar utas-students" data-value="2500">
                                        <div class="bar-fill"></div>
                                        <div class="bar-value">2.5K</div>
                                    </div>
                                    <div class="bar-label">UTAS Students</div>
                                </div>
                                
                                <div class="bar-container">
                                    <div class="bar tasmanian-locals" data-value="5000">
                                        <div class="bar-fill"></div>
                                        <div class="bar-value">5K</div>
                                    </div>
                                    <div class="bar-label">Locals</div>
                                </div>
                                
                                <div class="bar-container">
                                    <div class="bar social-media" data-value="8000">
                                        <div class="bar-fill"></div>
                                        <div class="bar-value">8K</div>
                                    </div>
                                    <div class="bar-label">Social Media Reach</div>
                                </div>
                                
                                <div class="bar-container">
                                    <div class="bar live-streaming" data-value="12000">
                                        <div class="bar-fill"></div>
                                        <div class="bar-value">12K</div>
                                    </div>
                                    <div class="bar-label">Live Streaming</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="graph-stats">
                        <div class="stat-item">
                            <span class="stat-number">27K</span>
                            <span class="stat-label">Total Reach</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">4</span>
                            <span class="stat-label">Channels</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">Live</span>
                            <span class="stat-label">Streaming</span>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </section>

</body>
</html>
