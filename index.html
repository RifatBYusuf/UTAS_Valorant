<body>

    <!-- Navigation -->
    <nav class="nav">
        <a href="index.html" class="active">Home</a>

    <!-- Slide 1: Title Slide -->
    <section class="slide active" data-slide="1">

        </video>

        <div id="fallbackBackground" class="fallback-bg" style="display: none;">

            <div class="hero-background"></div>
            <div class="hero-overlay"></div>
            
            <div class="hero-content">

                    <span class="subtitle">Valorant Showdown</span>
                </h1>
                <p class="hero-description">
                    UTAS Programming Club presents the first-ever Valorant Tournament in Tasmania
                </p>
                
                
                <div class="hero-stats">
                    <div class="stat-item">
                        <span class="stat-number">16</span>
                        <span class="stat-label">Registered Teams</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">1K+</span>
                        <span class="stat-label">Student Community</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">12K+</span>
                        <span class="stat-label">Total Views</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">4</span>

            </div>
